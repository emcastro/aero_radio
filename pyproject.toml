[project]
name = "aero-radio"
version = "0.1.0"
description = "MQTT-based IoT messaging system with RabbitMQ, mTLS, and FastAPI auth backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "paho-mqtt>=2.1.0",
    "pika>=1.3.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.300",
    "ogn-client>=1.0.0",
    "duckdb>=1.1.0",
    "requests>=2.31.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--ignore=tests_integ"

[tool.pyright]
# paho.mqtt.client doesn't re-export CallbackAPIVersion (it lives in paho.mqtt.enums)
# even though the paho docs recommend accessing it via mqtt.CallbackAPIVersion.
reportPrivateImportUsage = false
