[project]
name = "aero-radio"
version = "0.1.0"
description = "MQTT-based IoT messaging system with RabbitMQ, mTLS, and FastAPI auth backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "python-multipart>=0.0.20",
    "paho-mqtt>=2.1.0",
]
