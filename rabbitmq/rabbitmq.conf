## --- Listeners ---

# AMQP (for external consumers)
listeners.tcp.default = 5672

# Management UI
management.listener.port = 15672

# MQTT over TCP (debug only — remove in production)
mqtt.listeners.tcp.1 = 1883

# MQTT over TLS (device-facing)
mqtt.listeners.ssl.1 = 8883

## --- TLS ---

ssl_options.cacertfile    = /etc/rabbitmq/tls/ca.pem
ssl_options.certfile      = /etc/rabbitmq/tls/server.pem
ssl_options.keyfile       = /etc/rabbitmq/tls/server-key.pem
ssl_options.verify        = verify_peer
ssl_options.fail_if_no_peer_cert = true

## --- MQTT plugin ---

mqtt.allow_anonymous      = false
mqtt.ssl_cert_login       = true
ssl_cert_login_from  = common_name

## --- HTTP Auth Backend ---

auth_backends.1 = http
auth_backends.2 = internal

# NOTE: Cuttlefish does NOT expand env vars.
# To change the API key, edit the value below AND auth/.env / compose env var.
auth_http.http_method   = post
auth_http.user_path     = http://localhost:8000/auth/user?api_key=changeme
auth_http.vhost_path    = http://localhost:8000/auth/vhost?api_key=changeme
auth_http.resource_path = http://localhost:8000/auth/resource?api_key=changeme
auth_http.topic_path    = http://localhost:8000/auth/topic?api_key=changeme

## --- Auth mechanisms ---

auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = ANONYMOUS

## --- Default user (internal fallback) ---

default_user = admin
default_pass = admin
default_vhost = /
